# 本地与部署共用：变量默认值与 .env.example 保持一致，可用根目录 .env 覆盖。
# 依赖以 lock 文件为准安装，基础数据在镜像构建期校验、容器启动时幂等初始化。
services:
  backend:
    build: ./backend
    ports:
      # 主机与容器内端口都取 APP_PORT，保证“端口以那份配置为准”
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: ${APP_NAME:-特种设备点检运维平台}
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-8000}
      APP_SEED_ON_STARTUP: ${APP_SEED_ON_STARTUP:-true}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
    healthcheck:
      test: ["CMD", "python", "-c", "import json,os,urllib.request;port=os.environ.get('APP_PORT','8000');r=urllib.request.urlopen(f'http://127.0.0.1:{port}/api/health',timeout=3);raise SystemExit(0 if json.load(r).get('ok') else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "${VITE_DEV_PORT:-5173}:${VITE_DEV_PORT:-5173}"
    environment:
      VITE_DEV_HOST: 0.0.0.0
      VITE_DEV_PORT: ${VITE_DEV_PORT:-5173}
      VITE_PROXY_TARGET: http://backend:${APP_PORT:-8000}
      VITE_API_BASE: ${VITE_API_BASE:-}
      VITE_APP_NAME: ${VITE_APP_NAME:-特种设备点检运维平台}
    depends_on:
      backend:
        condition: service_healthy
